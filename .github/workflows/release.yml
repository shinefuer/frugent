name: Release artifacts
on:
  release:
    types: [published]
permissions: {contents: write}
jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.13 .venv
      - name: Install release checks
        run: uv pip install --python .venv/bin/python --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match -e ".[dev,torch]"
      - run: make release
      - run: .venv/bin/python scripts/check_package.py
      - name: Attach wheel to this GitHub release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl --clobber
